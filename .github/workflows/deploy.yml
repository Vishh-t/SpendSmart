      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "expense_manager_backend/target/Expense_Manager-0.0.1-SNAPSHOT.jar"
          target: /home/ubuntu/expense-manager/
          strip_components: 3

