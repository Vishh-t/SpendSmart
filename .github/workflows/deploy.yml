name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  JAR_NAME: Expense_Manager-0.0.1-SNAPSHOT.jar
  EC2_USER: ubuntu
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  APP_DIR: /home/ubuntu/expense-manager

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: expense_manager_backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Stopping existing service..."
            sudo systemctl stop expense-manager || true

            echo "Backing up old JAR..."
            mv ${{ env.APP_DIR }}/${{ env.JAR_NAME }} ${{ env.APP_DIR }}/${{ env.JAR_NAME }}.backup || true

            echo "Creating app directory..."
            mkdir -p ${{ env.APP_DIR }}

            echo "JAR built successfully, ready for deploy"

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "expense_manager_backend/target/Expense_Manager-0.0.1-SNAPSHOT.jar"
          target: ${{ env.APP_DIR }}/
          strip_components: 3

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ env.APP_DIR }}
            if ! sudo test -f /etc/systemd/system/expense-manager.service; then
              echo "Creating expense-manager systemd service..."
              cat <<'EOF' | sed 's/^  //' | sudo tee /etc/systemd/system/expense-manager.service > /dev/null
              [Unit]
              Description=Expense Manager Spring Boot Application
              After=network.target

              [Service]
              Type=simple
              User=${{ secrets.EC2_USER }}
              WorkingDirectory=${{ env.APP_DIR }}
              ExecStart=/usr/bin/java -jar ${{ env.APP_DIR }}/${{ env.JAR_NAME }}
              SuccessExitStatus=143
              Restart=always
              RestartSec=10

              [Install]
              WantedBy=multi-user.target
              EOF
            fi
            sudo systemctl daemon-reload
            sudo systemctl enable expense-manager
            echo "Starting expense-manager service..."
            sudo systemctl start expense-manager
            sleep 3
            sudo systemctl status expense-manager --no-pager