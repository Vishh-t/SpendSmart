name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  JAR_NAME: Expense_Manager-0.0.1-SNAPSHOT.jar
  EC2_USER: ubuntu
  APP_DIR: /home/ubuntu/expense-manager

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: expense_manager_backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Deploy to EC2 via SSH (setup service + deploy)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Stopping existing service..."
            sudo systemctl stop expense-manager || true

            echo "Creating app directory..."
            mkdir -p /home/ubuntu/expense-manager

            echo "Updating systemd service..."
            sudo tee /etc/systemd/system/expense-manager.service > /dev/null <<'EOF'
            [Unit]
            Description=Expense Manager Spring Boot Application
            After=network.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/home/ubuntu/expense-manager
            
            # --- CUSTOM ENVIRONMENT VARIABLES ---
            Environment="JWT_SECRET=${{ secrets.JWT_SECRET }}"
            Environment="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            Environment="GEMINI_API_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent"
            Environment="GEMINI_API_FALLBACK1_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent"
            Environment="GEMINI_API_FALLBACK2_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent"
            Environment="GEMINI_API_FALLBACK3_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent"
            Environment="GEMINI_API_FALLBACK4_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent"
            Environment="GEMINI_API_FALLBACK5_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
            Environment="GEMINI_API_FALLBACK6_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
            Environment="FRONTEND_URL=https://spend-smart-one-beta.vercel.app"
            Environment="GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            Environment="GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            
            # --- DIRECT DATABASE ARGUMENTS (Bypassing systemd environment parsing) ---
            ExecStart=/usr/bin/java -jar /home/ubuntu/expense-manager/Expense_Manager-0.0.1-SNAPSHOT.jar \
                --spring.datasource.url=jdbc:mysql://localhost:3306/manager?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true \
                --spring.datasource.username=root \
                --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
                --spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
            
            SuccessExitStatus=143
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOF
            sudo systemctl daemon-reload
            sudo systemctl enable expense-manager

            echo "Backing up old JAR..."
            mv /home/ubuntu/expense-manager/Expense_Manager-0.0.1-SNAPSHOT.jar /home/ubuntu/expense-manager/Expense_Manager-0.0.1-SNAPSHOT.jar.backup || true

            echo "JAR built successfully, ready for deploy"

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "expense_manager_backend/target/Expense_Manager-0.0.1-SNAPSHOT.jar"
          target: /home/ubuntu/expense-manager/
          strip_components: 2

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/expense-manager
            echo "Starting expense-manager service..."
            sudo systemctl daemon-reload
            sudo systemctl start expense-manager
            sleep 3
            sudo systemctl status expense-manager --no-pager