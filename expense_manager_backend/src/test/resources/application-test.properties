# Test Profile Configuration - Uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable caching for tests
spring.cache.type=none

# JWT secret for tests
jwt.secret=test-secret-key-for-testing-only-must-be-at-least-256-bits-long

# Gemini API (dummy values for tests)
gemini.api.key=test-key
gemini.api.url=http://localhost:9999
gemini.api.fallback1.url=http://localhost:9999
gemini.api.fallback2.url=http://localhost:9999
gemini.api.fallback3.url=http://localhost:9999
gemini.api.fallback4.url=http://localhost:9999
gemini.api.fallback5.url=http://localhost:9999
gemini.api.fallback6.url=http://localhost:9999

# Frontend URL
frontend.url=http://localhost:5173

# Google OAuth (dummy)
google.client.id=test-client-id
google.client.secret=test-client-secret

# Disable scheduler for tests
spring.task.scheduling.pool.size=0