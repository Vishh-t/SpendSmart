spring.application.name=Expenzo
#database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:replace-this-with-a-real-password-set-as-env-variable}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
jwt.secret=${JWT_SECRET:replace-this-with-a-real-secret-set-as-env-variable}
#security
spring.security.user.password=disabled
spring.security.user.name=disabled
#Ai Integration
gemini.api.key=${GEMINI_API_KEY:replace-this-with-a-real-api-key-set-as-env-variable}
gemini.api.url = https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent
gemini.api.fallback1.url = https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
gemini.api.fallback2.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
gemini.api.fallback3.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent
gemini.api.fallback4.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
gemini.api.fallback5.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.fallback6.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
frontend.url=${FRONTEND_URL:http://localhost:5173}
#File size limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#Response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
#Devtools — disable auto-restart so long-running background jobs (statement import) survive file/build changes mid-import
spring.devtools.restart.enabled=false

#GoogleAuth
google.client.secret = ${GOOGLE_CLIENT_SECRET:replace-this-with-a-real-secret-set-as-env-variable}
google.client.id = ${GOOGLE_CLIENT_ID:replace-this-with-a-real-client-id-set-as-env-variable}
